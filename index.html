<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4b6c2">
<title>💌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Lobster&family=Marck+Script&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">

<script>
/* =====================================================================
   НАЛАШТУВАННЯ САЙТУ — тут міняється весь текст, фото, відео і музика.
   Фото/відео кладіть у папку photos/ і пишіть шлях, напр. "photos/1.jpg".
   Порожні лапки "" = на сайті буде красива заглушка.
   Підтримуються: .jpg .jpeg .png .webp .gif  та відео .mp4 .mov .webm
   ===================================================================== */
const CONFIG = {
  name: "Sunshine",               // ім'я того, кому сайт
  from: "Me",                     // підпис у листі

  // фонові «рукописні» фрази
  scribbles: [
    "my baby is perfect",
    "i love every little thing about you",
    "hey baby, you are my favourite person",
  ],

  // Сторінка 1
  hero: {
    photo: "",
    caption: "I love spending time with you ❤️",
  },
  ticket: { label: "BUNNY", emoji: "🐰", number: "92914" },
  song: {
    title: "Our Song",
    artist: "Artist name",
    cover: "",                    // обкладинка пісні (картинка)
    src: "",                      // аудіофайл, напр. "photos/song.mp3"
  },
  postcard: "I want you to open this",

  // Сторінка 2
  strip: {
    photos: ["", "", ""],
    note: "I love you baby ❤️",
    sticker: "",                  // маленьке фото/стікер справа
    banner: "my baby, I love you · my baby, I love you",
  },

  // Сторінка 3
  gallery: [
    { photo: "", caption: "I love us ❤️" },
    { photo: "", caption: "I love you ❤️" },
    { photo: "", caption: "I love going on road trips with you 😊" },
    { photo: "", caption: "I love you ❤️" },
  ],
  galleryLabel: "i love you",

  // Лист
  letter: {
    greeting: "Dear {name},",
    text: "Hey baby, I love you more than words can say. Everything about you is perfect to me, your eyes, lips, voice, and laugh. I love every little thing about you. ❤️",
  },

  // Що з'являється після натискання на серце в кінці
  finale: "Happy Birthday, my love 🎂",
};
</script>

<style>
:root{
  --bg:#fbe4e9;
  --check:rgba(236,120,146,.42);
  --check-strong:rgba(214,38,78,.55);
  --wine:#8f1336;
  --wine-2:#b81d4a;
  --rose:#f2a5b4;
  --rose-2:#f7c6cf;
  --cream:#fcf7f0;
  --ink:#4b0d1f;
  --script:"Marck Script", cursive;
  --hand:"Caveat", cursive;
  --title:"Lobster", cursive;
  --ui:"Montserrat", system-ui, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:var(--ui);
  color:var(--ink);
  background-color:var(--bg);
  background-image:
    linear-gradient(90deg,var(--check) 50%,transparent 50%),
    linear-gradient(var(--check) 50%,transparent 50%);
  background-size:52px 52px;
  overflow-x:hidden;
  min-height:100svh;
}
body.locked{overflow:hidden;height:100svh}
img,video{display:block;width:100%;height:100%;object-fit:cover}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}

/* ---------- reusable bits ---------- */
.stk{filter:
  drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff)
  drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff)
  drop-shadow(0 6px 8px rgba(120,20,50,.18));}
.deco{position:absolute;pointer-events:none;z-index:6;animation:sway 6s ease-in-out infinite;transform-origin:50% 60%}
.deco.slow{animation-duration:9s}
.deco.flip{animation-direction:reverse}
@keyframes sway{0%,100%{rotate:-3deg}50%{rotate:4deg}}
.gframe{
  padding:10px;
  background-color:#fff;
  background-image:
    linear-gradient(90deg,var(--check-strong) 50%,transparent 50%),
    linear-gradient(var(--check-strong) 50%,transparent 50%);
  background-size:10px 10px;
  box-shadow:0 10px 22px rgba(120,20,50,.22);
}
.torn{clip-path:polygon(0 8px,6% 0,12% 6px,19% 1px,26% 7px,33% 0,41% 6px,48% 1px,56% 7px,63% 0,71% 6px,78% 1px,86% 7px,93% 0,100% 6px,100% calc(100% - 7px),94% 100%,87% calc(100% - 6px),80% 100%,72% calc(100% - 6px),65% calc(100% - 1px),57% calc(100% - 7px),49% 100%,42% calc(100% - 6px),34% 100%,27% calc(100% - 7px),19% calc(100% - 1px),12% calc(100% - 6px),5% 100%,0 calc(100% - 7px))}
.tape{position:absolute;width:110px;height:28px;background:rgba(244,150,170,.7);left:50%;top:-14px;translate:-50% 0;rotate:-3deg;z-index:3;
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.25) 0 6px,transparent 6px 12px)}
.photo{position:relative;overflow:hidden;background:#f6d9df}
.photo .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  color:#c2577a;font:600 12px/1 var(--ui);letter-spacing:.12em;text-transform:uppercase;
  background:repeating-linear-gradient(-45deg,#fbe8ec 0 12px,#f7dbe2 12px 24px)}
.photo .ph svg{width:34px;height:34px;opacity:.8}
.reveal{opacity:0;translate:0 28px;transition:opacity .8s ease,translate .8s cubic-bezier(.2,.8,.2,1)}
.reveal.in{opacity:1;translate:0 0}

/* ---------- INTRO / ENVELOPE ---------- */
#intro{
  position:fixed;inset:0;z-index:100;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;
  background:inherit;background-color:var(--bg);
  background-image:
    linear-gradient(90deg,var(--check) 50%,transparent 50%),
    linear-gradient(var(--check) 50%,transparent 50%);
  background-size:52px 52px;
  transition:opacity .9s ease, visibility .9s;
  overflow:hidden;
}
#intro.gone{opacity:0;visibility:hidden}
.envelope{position:relative;width:min(80vw,340px);aspect-ratio:1.45;perspective:1000px;cursor:pointer;margin-top:4vh;
  animation:float 3.5s ease-in-out infinite}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -8px}}
.env-back{position:absolute;inset:0;background:#ec9fad;border-radius:6px;box-shadow:0 22px 40px rgba(140,30,60,.28)}
.env-card{position:absolute;left:6%;right:6%;top:7%;height:86%;z-index:1;background:var(--cream);border-radius:4px;
  display:flex;align-items:center;justify-content:center;font:42px var(--script);color:var(--wine);
  transition:transform .9s cubic-bezier(.3,.9,.3,1) 1s}
.env-l,.env-r,.env-b{position:absolute;inset:0;z-index:2;border-radius:6px}
.env-l{background:#f1abb8;clip-path:polygon(0 0,51% 55%,0 100%)}
.env-r{background:#efa6b3;clip-path:polygon(100% 0,49% 55%,100% 100%)}
.env-b{background:#f5b8c3;clip-path:polygon(0 100%,50% 47%,100% 100%)}
.env-flap{position:absolute;left:0;right:0;top:0;height:60%;z-index:3;background:#f9cdd5;
  clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0;
  transition:transform .8s ease .35s, z-index 0s linear .75s}
.seal{position:absolute;left:50%;top:57%;z-index:4;width:76px;height:76px;translate:-50% -50%;
  border-radius:48% 52% 50% 50%/52% 47% 53% 48%;
  background:radial-gradient(circle at 35% 30%,#d93464,#a2103d 55%,#6c0624);
  box-shadow:0 5px 10px rgba(80,0,20,.35),inset 0 0 0 6px rgba(0,0,0,.13),inset 0 0 0 9px rgba(255,255,255,.06);
  display:flex;align-items:center;justify-content:center;transition:transform .35s ease,opacity .35s ease}
.seal svg{width:46%;height:46%;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.envelope.open{animation:none}
.envelope.open .seal{transform:scale(.2) rotate(-30deg);opacity:0}
.envelope.open .env-flap{transform:rotateX(180deg);z-index:0}
.envelope.open .env-card{transform:translateY(-62%)}
.intro-name{font:clamp(46px,14vw,62px)/1 var(--title);color:var(--wine);text-align:center;padding:0 16px;
  text-shadow:0 2px 0 #fff,0 -2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff,2px 2px 0 #fff,-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff,0 8px 18px rgba(140,20,50,.25)}
.tap-btn{padding:16px 38px;border-radius:40px;background:rgba(255,255,255,.88);color:var(--wine);
  font:700 15px/1 var(--ui);letter-spacing:.32em;text-indent:.32em;box-shadow:0 8px 20px rgba(140,20,50,.18);
  animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{scale:1}50%{scale:1.05}}

/* ---------- MAIN ---------- */
main{position:relative;max-width:480px;margin:0 auto;overflow:hidden}
.page{position:relative;min-height:100svh;padding:70px 18px 60px}
.bg-script{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.bg-script p{position:absolute;left:-10%;white-space:nowrap;font:34px var(--script);color:rgba(150,20,52,.2);rotate:-9deg}

/* page 1 */
.title-paper{position:relative;z-index:4;margin:0 auto 18px;width:fit-content;max-width:92%;padding:14px 34px 18px;background:var(--cream);rotate:-2deg;
  font:clamp(48px,15vw,68px)/1 var(--script);color:var(--wine);text-align:center;box-shadow:0 8px 16px rgba(120,20,50,.15)}
.polaroid{position:relative;z-index:3;background:#fff;padding:12px 12px 0;box-shadow:0 14px 28px rgba(120,20,50,.25)}
.polaroid figcaption{font:600 23px/1.1 var(--hand);color:var(--ink);text-align:center;padding:12px 6px 14px}
.hero{width:88%;margin:0 auto;rotate:2deg}
.hero .photo{aspect-ratio:4/5}
.row1{position:relative;z-index:5;display:flex;align-items:flex-start;margin-top:4px}
.ticket{position:relative;width:62%;rotate:-6deg;background:#f0a7b5;padding:10px;box-shadow:0 10px 18px rgba(120,20,50,.2);
  -webkit-mask:radial-gradient(circle 9px at 100% 50%,transparent 98%,#000) ;mask:radial-gradient(circle 9px at 100% 50%,transparent 98%,#000)}
.ticket-in{border:2px solid #5a0e22;padding:20px 12px;display:flex;align-items:center;gap:10px;font:700 26px/1 Georgia,serif;letter-spacing:.06em;color:#3c0915}
.ticket-no{position:absolute;right:6px;top:50%;translate:0 -50%;writing-mode:vertical-rl;font:700 15px Georgia,serif;letter-spacing:.15em;color:#3c0915}
.player{position:relative;z-index:6;margin:-18px 0 0 auto;width:92%;rotate:1.5deg;background:#f9cdd6;border-radius:20px;padding:16px 16px 14px;
  box-shadow:0 14px 26px rgba(120,20,50,.22)}
.pl-top{display:flex;gap:14px;align-items:center}
.pl-cover{flex:0 0 64px;height:64px;border-radius:10px}
.pl-cover .ph svg{width:22px;height:22px}
.pl-cover .ph span{display:none}
.pl-meta{min-width:0;flex:1}
.pl-title{font:700 19px/1.2 var(--ui);color:#3a0a17;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-artist{font:500 15px/1.3 var(--ui);color:#a03357}
.eq{display:flex;gap:3px;align-items:flex-end;height:18px;margin-left:auto;flex:0 0 auto}
.eq i{width:4px;height:100%;background:var(--wine-2);border-radius:2px;transform-origin:bottom;transform:scaleY(.25)}
.player.playing .eq i{animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.3s!important}.eq i:nth-child(3){animation-delay:-.6s!important}.eq i:nth-child(4){animation-delay:-.15s!important}
@keyframes eq{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
.pl-bar{display:flex;align-items:center;gap:10px;margin-top:14px;font:600 12px var(--ui);color:#7c2443;font-variant-numeric:tabular-nums}
.pl-track{flex:1;height:5px;border-radius:3px;background:rgba(143,19,54,.18);overflow:hidden}
.pl-fill{height:100%;width:0;background:var(--wine-2);border-radius:3px}
.pl-btn{display:block;margin:10px auto 2px;width:52px;height:52px;border-radius:50%;color:#3a0a17}
.pl-btn svg{width:30px;height:30px}
.pl-foot{text-align:center;font:500 12px var(--ui);color:#9a4060}
.postcard{position:relative;z-index:4;margin-top:-6px;width:84%;rotate:-2deg;background:#fdfbf8;padding:22px 20px;display:grid;grid-template-columns:1fr auto;gap:12px;
  background-image:radial-gradient(rgba(150,60,80,.18) 1px,transparent 1.2px);background-size:12px 12px;box-shadow:0 10px 22px rgba(120,20,50,.2);text-align:left;cursor:pointer}
.postcard p{font:600 28px/1.25 var(--hand);color:var(--ink);align-self:end;border-right:1.5px solid rgba(90,20,40,.25);padding-right:12px}
.stamp{width:70px;height:84px;background:#f2a2b2;border:5px dotted #fdfbf8;outline:1px solid rgba(200,80,110,.25);outline-offset:-1px;rotate:4deg;
  display:flex;align-items:center;justify-content:center}
.stamp svg{width:38px;height:38px;color:#e2264f;animation:pulse 1.6s ease-in-out infinite}
.hint{position:relative;z-index:5;margin:26px auto 0;text-align:center;font:600 11px var(--ui);letter-spacing:.28em;color:var(--wine);opacity:.75}
.hint b{display:block;font-size:18px;animation:float 1.6s ease-in-out infinite}

/* page 2 */
.p2-grid{position:relative;z-index:3;display:grid;grid-template-columns:57% 1fr;gap:10px;align-items:start}
.strip{display:flex;flex-direction:column;gap:10px;rotate:-1.5deg}
.strip .photo{aspect-ratio:4/3.3;border:3px solid #fff}
.p2-side{position:relative;display:flex;flex-direction:column;align-items:center;padding-top:42%}
.note{position:relative;z-index:7;width:150%;margin-left:-40%;rotate:-4deg;background:var(--cream);padding:16px 14px;
  font:34px/1.05 var(--script);color:var(--ink);text-align:center;box-shadow:0 8px 16px rgba(120,20,50,.18)}
.sticker{margin-top:22px;width:100%;aspect-ratio:1;border:6px solid #fff;border-radius:16px;rotate:5deg;box-shadow:0 10px 20px rgba(120,20,50,.2)}
.sticker .ph span{font-size:10px}
.banner{position:relative;z-index:4;margin:34px -18px 0;padding:18px 0 22px;background:#f3b3bf;overflow:hidden;white-space:nowrap}
.banner p{display:inline-block;font:34px/1 var(--script);color:var(--wine);animation:marquee 14s linear infinite;padding-left:100%}
@keyframes marquee{to{transform:translateX(-100%)}}

/* page 3 */
.gallery{position:relative;z-index:3;display:grid;grid-template-columns:1fr 1fr;gap:26px 14px}
.gitem{position:relative}
.gitem:nth-child(1){rotate:-4deg}
.gitem:nth-child(2){rotate:3deg;margin-top:46px}
.gitem:nth-child(3){rotate:2deg;margin-top:-30px}
.gitem:nth-child(4){rotate:-3deg;margin-top:16px}
.gitem .photo{aspect-ratio:3/4}
.gcap{position:relative;margin:-8px auto 0;width:92%;background:#fff;padding:6px 8px 4px;text-align:center;font:600 20px/1.1 var(--hand);color:var(--ink);
  box-shadow:0 4px 8px rgba(120,20,50,.15)}
.glabel{position:absolute;z-index:8;left:50%;top:44%;transform:translate(-50%,-50%) rotate(-5deg);background:var(--cream);padding:10px 26px 14px;
  font:40px/1 var(--script);color:var(--wine);white-space:nowrap;box-shadow:0 10px 20px rgba(120,20,50,.22)}

/* letter */
.letter{position:relative;z-index:3;margin-top:40px;background:var(--cream);padding:46px 26px 40px;box-shadow:0 16px 34px rgba(120,20,50,.25)}
.l-greet{font:700 46px/1 var(--hand);color:#3e0916}
.l-div{display:flex;align-items:center;gap:12px;margin:22px 0 20px;color:#e0566d}
.l-div::before,.l-div::after{content:"";flex:1;height:1.5px;background:#ee9aa8}
.l-div svg{width:16px;height:16px}
.l-text{font:600 27px/1.55 var(--hand);color:#3e0916;white-space:pre-line}
.l-sign{margin:28px 0 0 auto;width:fit-content;min-width:55%;text-align:right;font:700 44px/1 var(--hand);color:#e0566d;padding-bottom:6px;
  border-bottom:2px solid #ee9aa8;border-radius:0 0 40% 60%/0 0 10px 6px}
.heart-wrap{position:relative;z-index:5;display:flex;flex-direction:column;align-items:center;margin-top:40px}
.heart-btn{width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:0 0 0 14px rgba(255,255,255,.35),0 14px 30px rgba(140,20,50,.2);
  display:flex;align-items:center;justify-content:center;color:#e2264f;animation:pulse 1.4s ease-in-out infinite}
.heart-btn svg{width:56px;height:56px}
.heart-tip{margin-top:26px;font:600 11px var(--ui);letter-spacing:.3em;color:var(--wine);opacity:.75}
.finale{margin-top:18px;min-height:2.4em;font:clamp(34px,10vw,46px)/1.15 var(--title);color:var(--wine);text-align:center;
  text-shadow:0 2px 0 #fff,0 -2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff;opacity:0;scale:.6;transition:opacity .6s ease,scale .6s cubic-bezier(.3,1.6,.5,1)}
.finale.show{opacity:1;scale:1}

/* effects */
#petals{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.petal{position:absolute;top:-30px;width:14px;height:18px;background:linear-gradient(135deg,#ffd0de,#f58fae);border-radius:0 80% 0 80%;opacity:.85;
  animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}
.burst{position:fixed;z-index:120;pointer-events:none;font-size:26px;animation:burst 1.4s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.2) rotate(var(--r));opacity:0}}

@media (min-width:560px){
  main{box-shadow:0 0 0 1px rgba(255,255,255,.4)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
}
</style>
</head>

<script>
(() => {
  const get = (path) => path.split(".").reduce((o, k) => (o == null ? o : o[k]), CONFIG);
  const fmt = (s) => String(s ?? "").replace(/\{name\}/g, CONFIG.name);

  document.title = `For ${CONFIG.name} 💌`;

  // text
  document.querySelectorAll("[data-bind]").forEach((el) => { el.textContent = fmt(get(el.dataset.bind)); });

  // photos / videos / placeholders
  const isVideo = (s) => /\.(mp4|mov|webm|m4v)(\?|$)/i.test(s);
  document.querySelectorAll("[data-photo]").forEach((el) => {
    const src = get(el.dataset.photo);
    if (src) {
      el.innerHTML = isVideo(src)
        ? `<video src="${src}" autoplay muted loop playsinline></video>`
        : `<img src="${src}" alt="" loading="lazy">`;
    } else {
      el.innerHTML = `<div class="ph"><svg><use href="#sCamera"/></svg><span>${el.dataset.label || ""}</span></div>`;
    }
  });

  // background handwriting
  document.querySelectorAll("[data-scribbles]").forEach((box, i) => {
    const lines = CONFIG.scribbles || [];
    for (let k = 0; k < 7; k++) {
      const p = document.createElement("p");
      p.textContent = (lines[(k + i) % lines.length] + "   ").repeat(3);
      p.style.top = `${8 + k * 14}%`;
      box.appendChild(p);
    }
  });

  // reveal on scroll
  const io = new IntersectionObserver((entries) => {
    entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
  }, { threshold: 0.15 });
  document.querySelectorAll(".reveal").forEach((el) => io.observe(el));

  // ---------- music player ----------
  const player = document.getElementById("player");
  const playIco = document.getElementById("playIco");
  const tCur = document.getElementById("tCur"), tLeft = document.getElementById("tLeft"), tFill = document.getElementById("tFill");
  const audio = CONFIG.song.src ? new Audio(CONFIG.song.src) : null;
  if (audio) audio.loop = true;
  let playing = false, fakeT = 0, fakeLen = 30, raf, last;
  const mmss = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
  const ICON_PLAY = '<path d="M7 4.5v15l13-7.5z" fill="currentColor"/>';
  const ICON_PAUSE = '<rect x="6" y="4.5" width="4" height="15" rx="1" fill="currentColor"/><rect x="14" y="4.5" width="4" height="15" rx="1" fill="currentColor"/>';
  function render(t, len) {
    tCur.textContent = mmss(t); tLeft.textContent = "-" + mmss(Math.max(0, len - t));
    tFill.style.width = `${(t / len) * 100}%`;
  }
  function tick(now) {
    if (!playing) return;
    if (audio) { render(audio.currentTime, audio.duration || 30); }
    else { fakeT = (fakeT + (now - (last || now)) / 1000) % fakeLen; last = now; render(fakeT, fakeLen); }
    raf = requestAnimationFrame(tick);
  }
  function setPlaying(on) {
    playing = on;
    player.classList.toggle("playing", on);
    playIco.innerHTML = on ? ICON_PAUSE : ICON_PLAY;
    if (audio) on ? audio.play().catch(() => setPlaying(false)) : audio.pause();
    last = null; cancelAnimationFrame(raf); if (on) raf = requestAnimationFrame(tick);
  }
  document.getElementById("playBtn").addEventListener("click", () => setPlaying(!playing));

  // ---------- falling petals ----------
  const petals = document.getElementById("petals");
  function spawnPetal() {
    if (petals.childElementCount > 10 || document.hidden) return;
    const p = document.createElement("div");
    p.className = "petal";
    p.style.left = Math.random() * 100 + "vw";
    p.style.setProperty("--dx", (Math.random() * 120 - 60) + "px");
    p.style.setProperty("--r", (Math.random() * 720 - 360) + "deg");
    p.style.animationDuration = 7 + Math.random() * 6 + "s";
    p.style.scale = 0.6 + Math.random() * 0.7;
    p.addEventListener("animationend", () => p.remove());
    petals.appendChild(p);
  }

  // ---------- envelope ----------
  const intro = document.getElementById("intro");
  const env = document.getElementById("envelope");
  let opened = false;
  function openEnvelope() {
    if (opened) return; opened = true;
    env.classList.add("open");
    if (audio) setPlaying(true);
    setTimeout(() => {
      intro.classList.add("gone");
      document.body.classList.remove("locked");
      document.getElementById("main").removeAttribute("aria-hidden");
      setInterval(spawnPetal, 1100);
    }, 2100);
  }
  env.addEventListener("click", openEnvelope);
  document.getElementById("tapBtn").addEventListener("click", openEnvelope);
  env.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") openEnvelope(); });

  // postcard -> letter
  const toLetter = () => document.getElementById("letter").scrollIntoView({ behavior: "smooth" });
  document.getElementById("postcard").addEventListener("click", toLetter);

  // ---------- heart burst ----------
  const EMO = ["❤️", "💗", "💕", "💖", "🌸", "💞"];
  document.getElementById("heartBtn").addEventListener("click", (ev) => {
    const r = ev.currentTarget.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    for (let i = 0; i < 26; i++) {
      const s = document.createElement("span");
      s.className = "burst";
      s.textContent = EMO[i % EMO.length];
      const a = Math.random() * Math.PI * 2, d = 90 + Math.random() * 170;
      s.style.left = cx + "px"; s.style.top = cy + "px";
      s.style.setProperty("--dx", Math.cos(a) * d + "px");
      s.style.setProperty("--dy", Math.sin(a) * d - 60 + "px");
      s.style.setProperty("--r", (Math.random() * 80 - 40) + "deg");
      s.style.fontSize = 18 + Math.random() * 20 + "px";
      s.addEventListener("animationend", () => s.remove());
      document.body.appendChild(s);
    }
    if (navigator.vibrate) navigator.vibrate(30);
    document.getElementById("finale").classList.add("show");
  });
})();
</script>
